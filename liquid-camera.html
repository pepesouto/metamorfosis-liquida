<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Liquid Chrome Camera</title>
  <link rel="stylesheet" href="liquid-camera.css">
</head>
<body>
  <video id="camera" autoplay muted playsinline></video>
  <div class="wash"></div>
  <main class="scene">
    <button id="start">Activar cámara</button>
    <div class="chrome" tabindex="0">
      <div class="grain"></div><div class="shine"></div><div class="caustic"></div>
      <span class="label">METAMORFOSIS LÍQUIDA</span>
      <h1>Liquid Chrome</h1>
      <p>Pasá el cursor o tocá la superficie.</p>
    </div>
  </main>
  <script src="liquid-camera.js"></script>
</body>
</html>
