<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071114" />
    <title>Metamorfosis Líquida — prueba de agua</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  </head>
  <body>
    <main id="stage" aria-label="Prueba visual de agua procedural">
      <div id="canvas-root"></div>
      <section class="controls" aria-label="Controles del efecto">
        <div class="eyebrow">METAMORFOSIS LÍQUIDA</div>
        <h1>Agua en movimiento</h1>
        <p class="hint" id="modeHint">Cámara en vivo · el agua se mueve sola</p>
        <button id="cameraButton" type="button">Activar cámara</button>
        <button id="variantButton" type="button">Ver variación degradé</button>
        <button id="referenceButton" type="button">Abrir demo original</button>
        <label>Intensidad <output id="intensityValue">0.65</output><input id="intensity" type="range" min="0" max="1.4" step="0.01" value="0.65"></label>
        <label>Displacement <output id="displacementValue">0.55</output><input id="displacement" type="range" min="0" max="1.5" step="0.01" value="0.55"></label>
        <label>Velocidad <output id="speedValue">0.42</output><input id="speed" type="range" min="0" max="1.5" step="0.01" value="0.42"></label>
        <label>Mezcla original <output id="blendValue">0.18</output><input id="blend" type="range" min="0" max="1" step="0.01" value="0.18"></label>
      </section>
    </main>

    <script id="vertex-shader" type="x-shader/x-vertex">
      precision highp float;
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      varying vec2 vUv;
      void main() {
        vUv = aTexCoord;
        gl_Position = vec4(aPosition, 1.0);
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uImage;
      uniform vec2 uResolution;
      uniform float uImageAspect;
      uniform float uCameraMode;
      uniform float uGradientMode;
      uniform float uDisplacement;
      uniform float uTime;
      uniform float uIntensity;
      uniform float uBlend;

      #define PI 3.14159265359

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
                   mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      float fbm(vec2 p) {
        float value = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 5; i++) {
          value += amp * noise(p);
          p = p * 2.03 + vec2(17.1, 9.2);
          amp *= 0.5;
        }
        return value;
      }

      vec2 coverUv(vec2 uv) {
        float screen = uResolution.x / uResolution.y;
        float image = uImageAspect;
        vec2 scale = vec2(1.0);
        if (screen > image) scale.y = image / screen;
        else scale.x = screen / image;
        return (uv - 0.5) * scale + 0.5;
      }

      void main() {
        vec2 uv = coverUv(vUv);
        // p5/WebGL entrega el video con el eje vertical invertido en algunos navegadores.
        if (uCameraMode > 0.5) uv.y = 1.0 - uv.y;
        float t = uTime;
        vec2 p = uv * vec2(1.15, 0.78);

        // Dos escalas de ruido + ondas direccionales evitan una simple onda horizontal.
        vec2 flow = vec2(
          fbm(p * 2.8 + vec2(t * 0.11, -t * 0.07)),
          fbm(p * 2.8 + vec2(-t * 0.09, t * 0.13))
        ) - 0.5;
        vec2 fine = vec2(
          fbm(p * 7.0 + vec2(-t * 0.19, t * 0.14)),
          fbm(p * 7.0 + vec2(t * 0.16, t * 0.21))
        ) - 0.5;
        float wave = sin(p.x * 9.0 + sin(p.y * 4.0 + t * 0.32) * 1.7 + t * 0.55);
        float wave2 = cos(p.y * 12.0 - p.x * 5.0 + t * 0.38);
        vec2 distortion = flow * 0.12 + fine * 0.035 + vec2(wave, wave2) * 0.012;
        distortion *= uIntensity;

        // Muestreo RGB separado: refracción cromática muy leve, tipo vidrio mojado.
        vec2 refract = distortion * vec2(1.0, 1.16);
        float aberration = 0.0022 * uIntensity;
        vec3 waterImage = vec3(
          texture2D(uImage, uv + refract + vec2(aberration, 0.0)).r,
          texture2D(uImage, uv + refract).g,
          texture2D(uImage, uv + refract - vec2(aberration, 0.0)).b
        );
        vec3 original = texture2D(uImage, uv).rgb;

        // Derivadas del campo para crear luces rasantes sobre la superficie.
        float left = fbm((p - vec2(0.008, 0.0)) * 4.0 + t * 0.08);
        float right = fbm((p + vec2(0.008, 0.0)) * 4.0 + t * 0.08);
        float up = fbm((p - vec2(0.0, 0.008)) * 4.0 + t * 0.08);
        float down = fbm((p + vec2(0.0, 0.008)) * 4.0 + t * 0.08);
        vec2 gradient = vec2(right - left, down - up);
        float highlight = pow(max(0.0, dot(normalize(vec3(gradient * 7.0, 1.0)), normalize(vec3(-0.35, -0.55, 1.0)))), 20.0);
        highlight *= 0.24 * uIntensity;
        float caustic = smoothstep(0.48, 0.78, fbm(p * 8.0 + t * 0.16)) * 0.055 * uIntensity;

        vec2 gradientUv = uv + distortion;
        if (uGradientMode > 0.5) {
          // Misma operación que el ejemplo original: map RG centrado en 0.5,
          // multiplicado por la intensidad y aplicado a las coordenadas UV.
          vec2 displace = texture2D(uImage, uv).rg;
          gradientUv = uv + (displace - 0.5) * uDisplacement * 0.40;
        }
        gradientUv = clamp(gradientUv, 0.001, 0.999);
        vec3 paletteA = vec3(0.035, 0.059, 0.188);
        vec3 paletteB = vec3(0.20, 0.125, 0.373);
        vec3 paletteC = vec3(0.267, 0.31, 0.639);
        vec3 paletteD = vec3(0.247, 0.682, 0.773);
        vec3 paletteE = vec3(0.725, 0.871, 0.965);
        float gradientFlow = 0.5 + 0.5 * sin(gradientUv.x * 3.0 + sin(gradientUv.y * 4.0 + t * 0.18) * 1.2 + t * 0.12);
        float gradientNoise = fbm(gradientUv * 1.7 + t * 0.04) * 0.30;
        float palettePosition = clamp(gradientUv.y * 0.92 + gradientFlow * 0.12 + gradientNoise * 0.10, 0.0, 1.0);
        vec3 gradientColor = palettePosition < 0.25 ? mix(paletteA, paletteB, palettePosition / 0.25) :
                             palettePosition < 0.5 ? mix(paletteB, paletteC, (palettePosition - 0.25) / 0.25) :
                             palettePosition < 0.75 ? mix(paletteC, paletteD, (palettePosition - 0.5) / 0.25) :
                             mix(paletteD, paletteE, (palettePosition - 0.75) / 0.25);
        vec3 color = uGradientMode > 0.5 ? gradientColor : mix(waterImage, original, uBlend);
        color += vec3(0.88, 0.96, 0.96) * (highlight + caustic);
        gl_FragColor = vec4(color, 1.0);
      }
    </script>
    <script src="sketch.js"></script>
  </body>
</html>
